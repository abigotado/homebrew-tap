name: Formula

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: formula-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  confluence:
    name: Formula validation (confluence-cli)
    uses: ./.github/workflows/formula-check.yaml
    with:
      formula: confluence-cli

  jira:
    name: Formula validation (jira-agent-cli)
    uses: ./.github/workflows/formula-check.yaml
    with:
      formula: jira-agent-cli

  redmine:
    name: Formula validation (redmine-agent-cli)
    uses: ./.github/workflows/formula-check.yaml
    with:
      formula: redmine-agent-cli

  slack:
    name: Formula validation (slack-agent-cli)
    uses: ./.github/workflows/formula-check.yaml
    with:
      formula: slack-agent-cli

  trello:
    name: Formula validation (trello-cli)
    uses: ./.github/workflows/formula-check.yaml
    with:
      formula: trello-cli

  youtrack:
    name: Formula validation (youtrack-agent-cli)
    uses: ./.github/workflows/formula-check.yaml
    with:
      formula: youtrack-agent-cli

  formula-validation-result:
    name: Formula validation
    needs: [confluence, jira, redmine, slack, trello, youtrack]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all Formula checks
        env:
          CONFLUENCE: ${{ needs.confluence.result }}
          JIRA: ${{ needs.jira.result }}
          REDMINE: ${{ needs.redmine.result }}
          SLACK: ${{ needs.slack.result }}
          TRELLO: ${{ needs.trello.result }}
          YOUTRACK: ${{ needs.youtrack.result }}
        run: |
          for result in "$CONFLUENCE" "$JIRA" "$REDMINE" "$SLACK" "$TRELLO" "$YOUTRACK"; do
            test "$result" = success || exit 1
          done
