name: Formula

on:
  pull_request:
    paths:
      - "Formula/**"
      - ".github/workflows/formula.yaml"
      - "README.md"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: formula-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formula-validation:
    name: Formula validation
    runs-on: macos-15
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@fd832223f9f99ebf0244dd20658680e5d4aca049 # 2026.08.03.2
        with:
          core: false
          cask: false
      - name: Install Homebrew test dependencies
        run: brew install-bundler-gems --groups=style,audit,formula_test
      - name: Audit Formula
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew style Formula/slack-agent-cli.rb
          brew audit --strict --new --online abigotado/tap/slack-agent-cli
          brew lgtm --online
      - name: Install from source
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install --formula --build-from-source abigotado/tap/slack-agent-cli
      - name: Test Formula
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew test abigotado/tap/slack-agent-cli
